<!DOCTYPE html>
<!--FAMCONT-APP-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1F3A">
<title>CONTAS · Contas da Família</title>
<style>
:root{--navy:#0B1F3A;--navy2:#16325C;--gold:#C9A54C;--gold2:#E6CB82;--bg:#F3F0E8;--card:#fff;--ink:#14213D;--mut:#667085;--line:#E6E1D6;
--ok:#1E8E5A;--okb:#E3F3EA;--blue:#2F6FB3;--blueb:#E6EFF9;--warn:#B26B00;--warnb:#FDF1D8;--bad:#C8372D;--badb:#FBE6E3;--fut:#6E56A8;--futb:#EFEAF8;--gray:#5B6474;--grayb:#EEF0F3;
--r:16px;--tabh:66px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Roboto,"Google Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit}
svg{display:block}
#app{min-height:100vh;display:flex;flex-direction:column}
/* Cabeçalho */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:calc(10px + var(--sat,env(safe-area-inset-top))) 14px 12px;box-shadow:0 2px 12px rgba(11,31,58,.25)}
.toprow{display:flex;align-items:center;flex-wrap:wrap;gap:10px;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,var(--gold2),var(--gold));color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:21px;flex:none}
.brand b{display:block;letter-spacing:2.5px;font-size:18px;line-height:1.1}
.brand small{display:block;color:var(--gold2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:12px;padding:7px 11px;border-radius:99px;background:rgba(255,255,255,.1);white-space:nowrap;display:flex;align-items:center;gap:6px;max-width:52vw;overflow:hidden;text-overflow:ellipsis}
.sync i{width:8px;height:8px;border-radius:99px;background:#94A3B8;flex:none}
.sync.ok i{background:#4ADE80}.sync.busy i{background:var(--gold2)}.sync.err i{background:#F87171}
.month{order:3;flex-basis:100%;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.08);border-radius:14px;padding:4px}
.month button{width:48px;height:42px;color:var(--gold2);border-radius:10px;display:grid;place-items:center}
.month button:active{background:rgba(255,255,255,.12)}
.ml{font-weight:600;font-size:17px;text-align:center;line-height:1.2}
.ml small{display:block;font-weight:400;font-size:11.5px;color:#CBD5E1}
body.welcome .month,body.welcome .tabs,body.welcome #fab,body.welcome .sync{display:none}
main{flex:1;width:100%;max-width:1400px;margin:0 auto;padding:14px 14px calc(var(--tabh) + 96px + var(--sab,env(safe-area-inset-bottom)))}
/* Navegação */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:var(--sab,env(safe-area-inset-bottom));height:calc(var(--tabh) + var(--sab,env(safe-area-inset-bottom)));box-shadow:0 -2px 10px rgba(16,24,40,.05)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--mut);min-width:0}
.tabs .ti{width:48px;height:32px;display:grid;place-items:center;border-radius:99px;transition:background .15s}
.tabs button.on{color:var(--navy);font-weight:700}
.tabs button.on .ti{background:#F2E6C4}
#fab{position:fixed;right:18px;bottom:calc(var(--tabh) + 18px + var(--sab,env(safe-area-inset-bottom)));width:62px;height:62px;border-radius:20px;background:linear-gradient(145deg,var(--gold2),var(--gold));color:var(--navy);box-shadow:0 8px 20px rgba(160,122,30,.45);z-index:25;display:grid;place-items:center}
/* Resumo do mês */
.sum{background:linear-gradient(150deg,var(--navy),#10284A 60%,#1B3B6B);color:#fff;border-radius:22px;padding:16px;position:relative;overflow:hidden}
.sum:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;border:22px solid rgba(201,165,76,.12)}
.sum .k{font-size:13px;color:#CBD5E1;position:relative}
.sum .big{font-size:clamp(23px,7.2vw,32px);font-weight:700;margin:3px 0 0;position:relative;line-height:1.15}
.sum .big small{font-size:14px;color:#CBD5E1;font-weight:400}
.prog{height:10px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px}
.progt{font-size:12.5px;color:#CBD5E1;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;position:relative}
.stat{background:rgba(255,255,255,.08);border-radius:12px;padding:9px 10px;min-width:0}
.stat b{display:block;font-size:clamp(13px,3.9vw,15.5px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:11.5px;color:#CBD5E1}
.stat.bad b{color:#FFA197}.stat.ok b{color:#86EFAC}
/* Filtros */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;margin-top:12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:14px;color:var(--ink);white-space:nowrap}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--grayb);color:var(--ink);font-size:12px;font-weight:700}
.chip.on .n{background:var(--gold);color:var(--navy)}
.chip.sm{padding:6px 12px;font-size:13px}
/* Grupos e cartões */
.gh{display:flex;align-items:center;gap:8px;margin:20px 2px 9px;font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--mut)}
.gh .dot{width:9px;height:9px;border-radius:99px;background:var(--c)}
.gh .tot{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:700;color:var(--ink);font-size:13.5px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 3px rgba(16,24,40,.06);border:1px solid #ECE7DB}
.bill{display:flex;gap:12px;padding:12px 12px 12px 15px;align-items:flex-start;position:relative;overflow:hidden;cursor:pointer}
.bill:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.bill:active{background:#FBFAF6}
.st-pago{--c:var(--ok)}.st-emdia{--c:var(--blue)}.st-logo{--c:var(--warn)}.st-atrasado{--c:var(--bad)}.st-futuro{--c:var(--fut)}.st-apagar{--c:var(--gray)}
.bill .ic{width:44px;height:44px;border-radius:13px;background:var(--bg);display:grid;place-items:center;font-size:22px;flex:none}
.bill .mid{flex:1;min-width:0}
.nm{font-weight:650;font-weight:600;font-size:15.5px;line-height:1.25;overflow-wrap:anywhere}
.sub{font-size:12.5px;color:var(--mut);margin:3px 0 7px;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--cb);color:var(--c);white-space:nowrap}
.p-pago{--c:var(--ok);--cb:var(--okb)}.p-emdia{--c:var(--blue);--cb:var(--blueb)}.p-logo{--c:var(--warn);--cb:var(--warnb)}.p-atrasado{--c:var(--bad);--cb:var(--badb)}.p-futuro{--c:var(--fut);--cb:var(--futb)}.p-apagar{--c:var(--gray);--cb:var(--grayb)}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none;max-width:42%}
.amt{font-weight:700;font-size:15.5px;white-space:nowrap}
.amt.na{font-size:11.5px;font-weight:700;color:var(--warn);background:var(--warnb);padding:4px 8px;border-radius:8px}
.per{font-size:11px;color:var(--mut);margin-top:-6px;white-space:nowrap}
.chk{width:44px;height:44px;border-radius:13px;border:2px solid #D7D2C6;color:#C9C3B5;display:grid;place-items:center;background:#fff}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.bill.st-pago .nm{color:#475467}
.note{font-size:12px;color:var(--mut);margin-top:6px;font-style:italic;overflow-wrap:anywhere}
.wkdots{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.wd{min-width:42px;height:34px;padding:0 9px;border-radius:10px;border:1.5px solid var(--line);font-size:12.5px;font-weight:700;color:var(--mut);background:#fff}
.wd.on{background:var(--ok);border-color:var(--ok);color:#fff}
.empty{text-align:center;color:var(--mut);padding:30px 16px;font-size:14.5px}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;margin-top:10px;font-size:13.5px;line-height:1.35;cursor:pointer}
.banner.bad{background:var(--badb);color:#7A1F17}.banner.info{background:#FFF6DF;color:#6B4E00}.banner.ok{background:var(--okb);color:#14532D}
.banner .go{margin-left:auto;font-weight:800;white-space:nowrap}
.banner .bi{font-size:20px;flex:none}
/* Layout de colunas */
.layout{display:block}
.side>.card,.side>.sum{margin-bottom:0}
/* Semanas */
.week{padding:14px}
.wh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wh b{font-size:16px;color:var(--navy)}
.wh small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.bar{height:7px;border-radius:99px;background:var(--grayb);overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F1EEE6}
.item:last-of-type{border-bottom:0}
.cb{width:34px;height:34px;border-radius:10px;border:2px solid #D7D2C6;color:transparent;display:grid;place-items:center;flex:none;background:#fff}
.cb.on{background:var(--ok);border-color:var(--ok);color:#fff}
.item .in{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere;cursor:pointer}
.item.done .in{color:var(--mut);text-decoration:line-through;text-decoration-color:#B8B2A4}
.item .v{font-size:13.5px;font-weight:700;white-space:nowrap}
.item .x{width:32px;height:32px;border-radius:9px;color:#A8A29A;font-size:20px;flex:none}
.wact{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap}
.lnk{color:var(--navy);font-weight:700;font-size:14px;padding:6px 0}
.lnk.gold{color:#9A7A22}
/* Resumo */
.sec{padding:16px;margin-top:12px}
.sec h4{margin:0 0 12px;font-size:15px;color:var(--navy);display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv div{background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}
.kv span{display:block;font-size:12px;color:var(--mut)}
.kv b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.hb{margin:10px 0}
.hb .l{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;margin-bottom:5px}
.hb .l span:last-child{font-weight:700;white-space:nowrap}
.hb .t{height:9px;border-radius:99px;background:var(--grayb);overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:99px;background:var(--navy)}
.hb .t i.g{background:var(--gold)}
.gauge{display:flex;align-items:center;gap:14px}
.gauge .ring{width:86px;height:86px;flex:none}
.gauge p{margin:0;font-size:14px;line-height:1.4}
.tip{background:linear-gradient(135deg,#FFF8E6,#FBEFD0);border:1px solid #EFD9A0}
.tip p{margin:0;font-size:14.5px;line-height:1.5;color:#4A3A10}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12.5px;color:var(--mut)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
/* Ajustes */
.set{padding:16px;margin-top:12px}
.set h4{margin:0 0 4px;font-size:16px;color:var(--navy)}
.set p.d{margin:0 0 12px;font-size:13.5px;color:var(--mut);line-height:1.45}
.btns{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:8px}
.tpl{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #F1EEE6;font-size:15px}
.tpl span{flex:1}
.about{text-align:center;color:var(--mut);font-size:12.5px;padding:18px 0 4px;line-height:1.6}
/* Formulários e folha */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(11,31,58,.5)}
.sheet-card{position:relative;background:#fff;width:100%;max-width:580px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:8px 18px calc(18px + var(--sab,env(safe-area-inset-bottom)));animation:up .18s ease-out}
.sheet-card:before{content:"";display:block;width:42px;height:4px;border-radius:9px;background:#D0D5DD;margin:4px auto 12px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
h3{margin:2px 0 14px;font-size:19px;color:var(--navy)}
label.f{display:block;font-size:13px;font-weight:700;color:var(--mut);margin-bottom:12px}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:6px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#FCFBF8;color:var(--ink);font-size:16px;font-weight:400}
label.f input:focus,label.f select:focus,label.f textarea:focus{outline:none;border-color:var(--gold);background:#fff}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:flex;background:var(--grayb);border-radius:12px;padding:4px;margin-top:6px;gap:4px}
.seg button{flex:1;padding:10px 4px;border-radius:9px;font-size:14px;font-weight:700;color:var(--mut);min-width:0}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;padding:14px 12px;border-radius:13px;font-weight:800;font-size:15px;text-align:center}
.btn.gold{background:linear-gradient(145deg,var(--gold2),var(--gold));color:var(--navy)}
.btn.navy{background:var(--navy);color:#fff}
.btn.ghost{background:var(--grayb);color:var(--ink)}
.btn.danger{background:var(--badb);color:var(--bad)}
.btn.line{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.hint{font-size:12.5px;color:var(--mut);margin:0 0 12px;line-height:1.45}
.err{color:var(--bad);font-size:13.5px;font-weight:700;margin:0 0 10px;min-height:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 92px + var(--sab,env(safe-area-inset-bottom)));background:#1F2937;color:#fff;padding:12px 16px;border-radius:13px;font-size:14px;display:none;z-index:60;align-items:center;gap:16px;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{display:flex}
#toast button{color:var(--gold2);font-weight:800}
/* Boas-vindas */
.wel{max-width:520px;margin:20px auto;padding:24px 20px;text-align:center}
.wel .logo{width:72px;height:72px;font-size:38px;border-radius:22px;margin:0 auto 14px}
.wel h2{margin:0;color:var(--navy);letter-spacing:3px}
.wel p{color:var(--mut);line-height:1.5;font-size:14.5px}
.wel .btn{display:block;width:100%;margin-top:10px}
/* Contas familiares */
.famhi{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;margin-bottom:12px;cursor:pointer;background:#fff;border:2px solid var(--gold);box-shadow:0 4px 14px rgba(160,122,30,.18);position:relative;overflow:hidden}
.famhi:before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--fc,var(--gold))}
.famhi .fn{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;font-weight:900;flex:none;background:var(--fb,#F7EBC8);color:var(--fc2,#6B4E00)}
.famhi .ft{flex:1;min-width:0}
.famhi .ft b{display:block;font-size:16.5px;color:var(--navy)}
.famhi .ft span{display:block;font-size:13.5px;color:var(--mut);margin-top:3px;line-height:1.35}
.famhi .go{font-weight:800;color:#9A7A22;font-size:14px;white-space:nowrap}
.famhi.zero{border-color:var(--line);box-shadow:none;--fc:#C9CED6;--fb:var(--grayb);--fc2:var(--gray)}
.famhi.bad{border-color:var(--bad);--fc:var(--bad);--fb:var(--badb);--fc2:var(--bad)}
.famhi.ok{border-color:var(--ok);--fc:var(--ok);--fb:var(--okb);--fc2:var(--ok)}
.tabs button{position:relative}
.tbadge{position:absolute;top:4px;left:calc(50% + 8px);min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid #fff}
.tbadge.g{background:var(--gold);color:var(--navy)}
.tbadge[hidden]{display:none}
.ag{padding:14px 14px 12px}
.ag .ah{display:flex;gap:12px;align-items:flex-start}
.ag .av{width:46px;height:46px;border-radius:14px;background:#F7EBC8;display:grid;place-items:center;font-size:20px;font-weight:800;color:#6B4E00;flex:none}
.ag .at{flex:1;min-width:0}
.ag .at b{display:block;font-size:16px;color:var(--navy);overflow-wrap:anywhere}
.ag .at small{display:block;font-size:12.5px;color:var(--mut);margin-top:2px;overflow-wrap:anywhere}
.ag .who{display:inline-block;font-size:12px;font-weight:800;color:#6B4E00;background:#F7EBC8;padding:2px 9px;border-radius:99px;margin-bottom:4px}
.pinfo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
.pinfo div{background:var(--bg);border-radius:12px;padding:8px 10px;min-width:0}
.pinfo span{display:block;font-size:11.5px;color:var(--mut)}
.pinfo b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:13px 14px;border-radius:13px;background:#fff;border:1.5px solid #DADCE0;font-weight:700;font-size:15.5px;color:#1F1F1F;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.gbtn:active{background:#F7F8F8}
.orline{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12.5px;margin:14px 0}
.orline:before,.orline:after{content:"";flex:1;height:1px;background:var(--line)}
.pixbox{background:#F6F8FB;border:1px solid #DCE4EF;border-radius:14px;padding:10px;margin-bottom:10px}
.pxh{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;font-size:14px;color:var(--ink);padding:0 2px 8px}
.pxh .bk{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--gray);background:#fff;border:1px solid #DCE4EF;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pxk{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #C8D6EA;border-radius:12px;padding:8px 8px 8px 10px}
.pxk .tag{flex:none;background:var(--navy);color:#fff;font-size:11px;font-weight:800;letter-spacing:.6px;padding:5px 8px;border-radius:8px;line-height:1.15;text-align:center}
.pxk .tag small{display:block;color:var(--gold2);font-size:10px;letter-spacing:.3px}
.pxk .key{flex:1;min-width:0;font-size:17px;font-weight:800;letter-spacing:.4px;color:var(--navy);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pxk button{flex:none;display:flex;align-items:center;gap:6px;background:var(--blue);color:#fff;font-weight:800;font-size:14px;padding:9px 13px;border-radius:10px}
.pxk button:active{opacity:.85}
.logo{overflow:hidden;padding:0}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
button.logo{cursor:pointer}

<script>
'use strict';
/* ================= Configuração ================= */
const APP={name:'CONTAS',version:'1.6.0',build:9,repo:'hocconsultor-HOC/famcont'};
APP.apk='https://github.com/'+APP.repo+'/releases/download/app-android/FAMCONT.apk';
APP.info='https://raw.githubusercontent.com/'+APP.repo+'/main/version.json';
const FB={apiKey:'AIzaSyDsuh0H-KtQcDOBVQ8WrcGUelo95fImzT8',projectId:'famcont-44007',googleClient:'207577892432-fmd40r5cfriqngh0cipbu3gsr7aumb7o.apps.googleusercontent.com'}; // nuvem (Firebase · projeto FAMCONT, chave pública; a segurança é feita pelas regras do banco)
const KEY='famcont.v1',KAUTH='famcont.auth',KMETA='famcont.meta';
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const CATS={investimento:['📈','Investimento'],doacao:['⛪','Dízimo e doações'],filhos:['🧒','Filhos'],moradia:['🏠','Moradia'],energia:['💡','Luz, água e gás'],transporte:['🚗','Transporte'],educacao:['🎓','Educação'],telecom:['📱','Celular, internet e TV'],saude:['🩺','Saúde'],seguro:['🛡️','Seguros e previdência'],cartao:['💳','Cartões'],emprestimo:['🏦','Empréstimos'],eventos:['🎉','Eventos'],outros:['📌','Outros']};
const STL={atrasado:'Atrasadas',logo:'Vencem nos próximos dias',emdia:'Em dia',apagar:'A pagar (sem dia fixo)',futuro:'Planejadas',pago:'Pagas'};
const TIPS=[
 'Pague-se primeiro: trate o investimento como uma conta fixa e separe o valor no dia em que o dinheiro entra. É como encher o tanque antes da viagem.',
 'Conta atrasada custa caro: além da multa (até 2%) vêm os juros de mora todo mês. Pagar em dia é um "rendimento" garantido.',
 'Cartão de crédito é ferramenta, não renda extra. Pagar a fatura inteira evita os juros mais altos do mercado.',
 'Aproxime os vencimentos do dia em que o salário cai: fica mais fácil não esquecer nada e o mês fica mais leve.',
 'Reserva de emergência é o "estepe" da família: o ideal é ter de 6 a 12 meses do custo fixo guardados com resgate imediato.',
 'Revise assinaturas e planos (TV, internet, celular) a cada 6 meses. Pequenas economias mensais viram um bom valor no ano.',
 'Débito automático ajuda, mas confira o extrato: automático não quer dizer correto.',
 'Evento grande à vista (festa, viagem)? Divida o valor pelos meses que faltam e guarde todo mês. Assim a festa não vira dívida.',
 'Seguro de vida e previdência protegem o plano da família. Trate como compromisso, não como o que sobra.',
 'Quando toda a família enxerga as contas, o orçamento vira um projeto da casa, e não o peso de uma pessoa só.'];

/* ================= Utilidades ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const now=()=>Date.now();
const pad=n=>String(n).padStart(2,'0');
const brl=v=>(v!=null&&!isNaN(v)&&typeof meta!=='undefined'&&meta.hide)?'R$ •••':brlRaw(v);
const brlRaw=v=>(v==null||isNaN(v))?'—':v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function parseBRL(s){
  if(s==null)return null; s=String(s).replace(/[R$\s]/g,''); if(!s)return null;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const n=Number(s); return (isFinite(n)&&n>=0)?Math.round(n*100)/100:NaN;
}
const fmtAmt=v=>v==null?'':v.toFixed(2).replace('.',',');
function today(){
  try{const q=new URLSearchParams(location.search).get('hoje');
    if(q&&/^\d{4}-\d{2}-\d{2}$/.test(q)){const p=q.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}}catch(e){}
  const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());
}
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const mkey=(y,m)=>y+'-'+pad(m);
const pk=k=>k.split('-').map(Number);
const curKey=()=>{const t=today();return mkey(t.getFullYear(),t.getMonth()+1)};
const shiftKey=(k,n)=>{let p=pk(k),y=p[0],m=p[1]+n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return mkey(y,m)};
const dim=k=>{const p=pk(k);return new Date(p[0],p[1],0).getDate()};
const fmtD=s=>{if(!s)return'';const p=s.split('-');return p[2]+'/'+p[1]};
const fmtDY=s=>{if(!s)return'';const p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]};
const mName=k=>{const p=pk(k);return MESES[p[1]-1]+'/'+p[0]};
const live=a=>(a||[]).filter(x=>!x.del);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ================= Estado ================= */
let S=null;
let ui={tab:'meses',month:curKey(),filter:'todas',pessoa:'',undo:null};
let meta=store.get(KMETA)||{lastBackup:null};
let storageOk=true;

function blankState(){return {v:1,cfg:{renda:null,people:['Família'],weekly:[],u:0},months:{},fam:[]}}
function normalize(x){
  if(!x||typeof x!=='object')return null;
  if(x.data&&(x.app==='FAMCONT'||x.app==='CONTAS'))x=x.data;
  if(!x.months||typeof x.months!=='object')return null;
  const b=blankState(); x.cfg=Object.assign(b.cfg,x.cfg||{});
  for(const k of Object.keys(x.months)){const M=x.months[k]; if(!/^\d{4}-\d{2}$/.test(k)||!M){delete x.months[k];continue}
    if(M.del)continue; M.bills=M.bills||[]; M.weeks=M.weeks||[]; M.u=M.u||0;
    M.bills.forEach(b=>{if(!b.id)b.id=uid(); if(b.del)return; if(!b.freq)b.freq='mensal'; if(!b.status)b.status='aberto'; if(!CATS[b.cat])b.cat='outros';});
    M.weeks.forEach(w=>{if(!w.id)w.id=uid(); if(w.del)return; w.items=w.items||[]; w.items.forEach(i=>{if(!i.id)i.id=uid()})});}
  x.fam=Array.isArray(x.fam)?x.fam:[]; x.fam.forEach(a=>{if(!a.id)a.id=uid(); if(a.del)return; a.pagos=a.pagos||{}; a.n=Math.max(1,parseInt(a.n)||1); if(a.pix&&!a.pixChave){const o=String(a.pix);a.pixChave=pixKey(o);a.pixTipo=/cnpj/i.test(o)?'CNPJ':/cpf/i.test(o)?'CPF':/@/.test(o)?'E-mail':/^\+?[\d\s()-]{10,}$/.test(a.pixChave)?'Celular':'Chave aleatória';const bk=o.split('·').map(t=>t.trim()).find(t=>t&&!t.includes(a.pixChave)&&!/^pix/i.test(t));if(bk&&!a.banco)a.banco=bk.replace(/^banco\s+/i,'');delete a.pix}});
  x.v=1; return sortMonths(x);
}
function sortMonths(x){const o={};Object.keys(x.months).sort().forEach(k=>o[k]=x.months[k]);x.months=o;return x}
const getM=k=>{const M=S&&S.months[k];return (M&&!M.del)?M:null};
function save(noSync){
  sortMonths(S); storageOk=store.set(KEY,S);
  if(!storageOk)toast('Atenção: não foi possível salvar neste aparelho.');
  if(!noSync)scheduleSync();
  scheduleDrive();
}

/* ================= Semanas do mês ================= */
function genWeeks(k){
  const p=pk(k),n=dim(k),groups=[];let cur=null;
  for(let d=1;d<=n;d++){const wd=new Date(p[0],p[1]-1,d).getDay(); if(wd===0||wd===6)continue;
    if(!cur||wd===1){cur=[];groups.push(cur)} cur.push(d);}
  if(groups.length>1&&groups[0].length<3){groups[1]=groups[0].concat(groups[1]);groups.shift()}
  if(groups.length>1&&groups[groups.length-1].length<3){const l=groups.pop();groups[groups.length-1]=groups[groups.length-1].concat(l)}
  return groups.map(g=>({id:uid(),u:now(),start:k+'-'+pad(g[0]),end:k+'-'+pad(g[g.length-1]),
    items:S.cfg.weekly.map(t=>({id:uid(),u:now(),name:t.name,amount:t.amount==null?null:t.amount,done:false}))}));
}
const weeksOf=k=>{const M=getM(k);return M?live(M.weeks):[]};
function ensureMonth(k){

  const bills=src?live(src.bills).filter(b=>b.freq!=='unica'||b.status==='futuro').map(b=>Object.assign({},b,{id:uid(),u:now(),

/* ================= Situação de cada conta ================= */
function amtOf(b,k){if(b.amount==null)return null;return b.freq==='semanal'?b.amount*weeksOf(k).length:b.amount}
function status(b,k){
  if(b.status==='pago')return {k:'pago',txt:b.paidAt?'Pago em '+fmtD(b.paidAt):'Pago'};
  if(b.status==='futuro')return {k:'futuro',txt:'Planejado'+(b.day?' · dia '+b.day:'')};
  const ck=curKey(),t=today();
  if(b.freq==='semanal'){
    const w=weeksOf(k),done=(b.wk||[]).filter(Boolean).length;
    if(k<ck)return {k:'atrasado',txt:done+'/'+w.length+' semanas · mês encerrado'};
    if(k>ck)return {k:'emdia',txt:'0/'+w.length+' semanas'};
    const late=w.some((x,i)=>!(b.wk||[])[i]&&x.end<iso(t));
    return late?{k:'atrasado',txt:done+'/'+w.length+' semanas · há semana em atraso'}:{k:'emdia',txt:done+'/'+w.length+' semanas pagas'};
  }
  if(k<ck)return {k:'atrasado',txt:'Não paga no mês'+(b.day?' (dia '+b.day+')':'')};
  if(k>ck)return b.day?{k:'emdia',txt:'Vence dia '+b.day}:{k:'apagar',txt:'A pagar · sem dia fixo'};
  if(!b.day)return {k:'apagar',txt:'A pagar · sem dia fixo'};
  const d=Math.min(b.day,dim(k)),diff=d-t.getDate();
  if(diff<0)return {k:'atrasado',txt:'Atrasada há '+(-diff)+(diff===-1?' dia':' dias')};
  if(diff===0)return {k:'logo',txt:'Vence hoje'};
  if(diff<=3)return {k:'logo',txt:'Vence em '+diff+(diff===1?' dia':' dias')};
  return {k:'emdia',txt:'Em dia · vence dia '+d};
}
function totals(k,list){
  const T={tot:0,pago:0,aberto:0,atras:0,n:0,nPago:0,nAtras:0,nAberto:0,semValor:0,nFut:0,fut:0};
  for(const b of list){const a=amtOf(b,k),s=status(b,k).k;
    if(s==='futuro'){T.nFut++;if(a!=null)T.fut+=a;continue}
    T.n++; if(a==null)T.semValor++;else T.tot+=a;
    if(s==='pago'){T.nPago++;if(a!=null)T.pago+=a}
    else{T.nAberto++;if(a!=null)T.aberto+=a;if(s==='atrasado'){T.nAtras++;if(a!=null)T.atras+=a}}}
  return T;
}

const hasBridge=()=>!!(window.FamBridge&&FamBridge.writeDrive);
function driveInfo(){if(!hasBridge())return {linked:false};try{return JSON.parse(FamBridge.driveInfo())}catch(e){return {linked:false}}}
let driveT=null;
function scheduleDrive(){if(!hasBridge()||!meta.driveOn)return;clearTimeout(driveT);driveT=setTimeout(()=>driveWrite(false),8000)}
function driveWrite(manual){
  if(!hasBridge()||!S)return;const r=FamBridge.writeDrive(backupText());
  if(r==='ok'){meta.driveLast=now();meta.lastBackup=now();meta.driveErr='';store.set(KMETA,meta);if(manual)toast('Backup salvo no Google Drive ✓')}
  else if(r==='perdido'||r==='sem-vinculo'){meta.driveOn=false;meta.driveErr='O vínculo com o arquivo do Drive foi perdido. Ligue de novo.';store.set(KMETA,meta);if(manual)toast(meta.driveErr)}
  else{meta.driveErr='Última tentativa falhou: '+r.replace(/^erro: /,'');store.set(KMETA,meta);if(manual)toast('Não foi possível salvar no Drive agora')}
  if(ui.tab==='ajustes'&&!sheetOpen())render();
}
window.famDriveLinked=(name,isDrive)=>{
  if(!name){toast('Backup no Drive não foi ligado.');return}
  meta.driveOn=true;meta.driveName=name;meta.driveIsDrive=!!isDrive;store.set(KMETA,meta);driveWrite(false);render();
  toast(isDrive?'Backup automático ligado no Google Drive ✓':'Backup ligado em "'+name+'" (não é o Google Drive)');
};

/* ================= Backup, compartilhar ================= */
function backupText(){return JSON.stringify({app:'CONTAS',v:1,exportedAt:new Date().toISOString(),data:S},null,1)}
function importText(t){let x;try{x=normalize(JSON.parse(t))}catch(e){return false}if(!x)return false;
  S=S&&auth?mergeState(x,S):x; if(!getM(curKey())&&Object.keys(S.months).length)ensureMonth(curKey());
  ui.month=curKey();save();render();toast('Contas importadas ✓');return true}
function saveText(name,text){
  if(window.FamBridge&&FamBridge.saveFile){try{toast(FamBridge.saveFile(name,text))}catch(e){toast('Não foi possível salvar o arquivo')}return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Arquivo salvo em Downloads')}
function shareText(title,text){
  if(window.FamBridge&&FamBridge.share){FamBridge.share(title,text);return}
  if(navigator.share){navigator.share({title,text}).catch(()=>{});return}
  if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast('Copiado. Cole onde quiser.'),()=>toast('Não foi possível copiar'));}
function openUrl(u){if(window.FamBridge&&FamBridge.openUrl)FamBridge.openUrl(u);else window.open(u,'_blank')}
function summaryText(){
  const k=ui.month,M=getM(k),bills=live(M.bills),T=totals(k,bills),sk=b=>status(b,k).k;
  const late=bills.filter(b=>sk(b)==='atrasado'),soon=bills.filter(b=>['logo','emdia'].includes(sk(b))&&b.day).sort((a,b)=>a.day-b.day).slice(0,6);
  let t='📋 CONTAS · '+mName(k)+'\n\n✅ Pagas: '+T.nPago+' de '+T.n+' ('+brlRaw(T.pago)+')\n⏳ Falta pagar: '+brlRaw(T.aberto)+'\n';
  if(late.length)t+='\n⚠️ Atrasadas:\n'+late.map(b=>'• '+b.name+(b.day?' (dia '+b.day+')':'')+(b.amount!=null?' – '+brlRaw(amtOf(b,k)):'')).join('\n')+'\n';
  if(soon.length)t+='\n📅 Próximos vencimentos:\n'+soon.map(b=>'• Dia '+b.day+' – '+b.name+(b.amount!=null?' – '+brlRaw(b.amount):'')).join('\n')+'\n';
  const FM=famMonth(k).filter(x=>x.st.k!=='pago');
  if(FM.length)t+='\n👪 Contas familiares a transferir:\n'+FM.map(x=>'• Dia '+pad(x.a.dia||1)+' – '+x.a.pessoa+' – '+x.a.desc+' ('+(x.i+1)+'/'+x.a.n+') – '+brlRaw(x.a.parcela)).join('\n')+'\n';
  return t+'\nConsultor Financeiro Henrique Costa · @hocconsultoria';
}

/* ================= Nuvem (Firebase) ================= */
let auth=store.get(KAUTH),syncSt={st:auth?'idle':'local',at:auth&&auth.at||null},syncing=false,syncTimer=null;
function renderSync(){const el=$('#sync');if(!el)return;let c='',t='Neste aparelho';
  if(auth){if(syncSt.st==='busy'){c='busy';t='Sincronizando…'}else if(syncSt.st==='ok'){c='ok';t='Sincronizado '+new Date(syncSt.at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
    else if(syncSt.st==='offline'){c='err';t='Sem internet · salvo aqui'}else if(syncSt.st==='err'){c='err';t='Erro na nuvem'}else{c='busy';t='Nuvem conectada'}}
  el.className='sync '+c;el.querySelector('span').textContent=t}
const AERR={EMAIL_NOT_FOUND:'E-mail ou senha incorretos.',INVALID_PASSWORD:'E-mail ou senha incorretos.',INVALID_LOGIN_CREDENTIALS:'E-mail ou senha incorretos.',EMAIL_EXISTS:'Este e-mail já tem conta. Use "Entrar".',INVALID_EMAIL:'E-mail inválido.',MISSING_PASSWORD:'Informe a senha.',TOO_MANY_ATTEMPTS_TRY_LATER:'Muitas tentativas. Aguarde alguns minutos.',USER_DISABLED:'Conta desativada.'};
async function api(url,body,form){const r=await fetch(url,{method:'POST',headers:{'Content-Type':form?'application/x-www-form-urlencoded':'application/json'},body:form?body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));
  if(!r.ok){const m=(j.error&&j.error.message)||'ERRO';throw new Error(m)}return j}
async function doAuth(create){
  const e=$('#a_err'),email=$('#a_email').value.trim(),pw=$('#a_pw').value;e.textContent='';
  if(!FB.apiKey){e.textContent='A nuvem será ativada na versão final do app.';return}
  if(!email||!pw){e.textContent='Informe e-mail e senha.';return}
  try{const j=await api('https://identitytoolkit.googleapis.com/v1/accounts:'+(create?'signUp':'signInWithPassword')+'?key='+FB.apiKey,{email,password:pw,returnSecureToken:true});
    auth={email:j.email,uid:j.localId,idToken:j.idToken,refreshToken:j.refreshToken,exp:now()+Number(j.expiresIn)*1000};store.set(KAUTH,auth);
    toast('Conectado! Sincronizando…');await syncNow(true);render();}
  catch(err){const m=String(err.message||'');e.textContent=m.startsWith('WEAK_PASSWORD')?'Senha fraca: use pelo menos 6 caracteres.':(AERR[m.split(' ')[0]]||(m==='Failed to fetch'?'Sem internet. Tente de novo.':'Não foi possível entrar ('+m+').'))}
}
function googleLogin(){
  if(!(window.FamBridge&&FamBridge.googleSignIn)){toast('O login com Google funciona no app instalado no Android.');return}
  const e=$('#g_aerr');if(e)e.textContent='Abrindo sua conta Google…';FamBridge.googleSignIn(FB.googleClient);
}
window.famGoogle=async(tok,err)=>{
  const e=$('#g_aerr');
  if(!tok){if(e)e.textContent=err==='cancelado'?'':('Não foi possível entrar com Google. '+(err||''));return}
  try{if(e)e.textContent='Conectando…';
    const j=await api('https://identitytoolkit.googleapis.com/v1/accounts:signInWithIdp?key='+FB.apiKey,{postBody:'id_token='+encodeURIComponent(tok)+'&providerId=google.com',requestUri:'http://localhost',returnIdpCredential:true,returnSecureToken:true});
    if(!j.idToken){if(e)e.textContent=j.needConfirmation?'Este e-mail já tem conta com senha. Entre com e-mail e senha.':'Não foi possível entrar.';return}
    if(!S){S=blankState();save(true)}
    auth={email:j.email,uid:j.localId,idToken:j.idToken,refreshToken:j.refreshToken,exp:now()+Number(j.expiresIn)*1000,google:true};store.set(KAUTH,auth);
    toast('Conectado com Google ✓ Sincronizando…');ui.tab='meses';await syncNow(true);
    if(!getM(curKey())&&Object.keys(S.months).some(k=>getM(k)))ensureMonth(curKey());render();
  }catch(x){if(e)e.textContent='Não foi possível entrar com Google ('+x.message+').'}
};
async function doReset(){const e=$('#a_err'),email=$('#a_email').value.trim();if(!FB.apiKey){e.textContent='A nuvem será ativada na versão final do app.';return}if(!email){e.textContent='Digite seu e-mail acima e toque de novo.';return}
  try{await api('https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key='+FB.apiKey,{requestType:'PASSWORD_RESET',email});e.style.color='var(--ok)';e.textContent='Enviamos um e-mail para redefinir a senha.'}catch(err){e.textContent=AERR[String(err.message)]||'Não foi possível enviar.'}}
async function idToken(){if(auth.exp-now()>120000)return auth.idToken;
  const j=await api('https://securetoken.googleapis.com/v1/token?key='+FB.apiKey,'grant_type=refresh_token&refresh_token='+encodeURIComponent(auth.refreshToken),true);
  auth.idToken=j.id_token;auth.refreshToken=j.refresh_token;auth.exp=now()+Number(j.expires_in)*1000;store.set(KAUTH,auth);return auth.idToken}
const docUrl=()=>'https://firestore.googleapis.com/v1/projects/'+FB.projectId+'/databases/(default)/documents/famcont/'+auth.uid;
function mergeList(base,other,sub){const out=new Map();(base||[]).forEach(x=>out.set(x.id,x));
  (other||[]).forEach(y=>{const x=out.get(y.id);if(!x){out.set(y.id,y);return}let w=(y.u||0)>(x.u||0)?y:x;
    if(sub&&!x.del&&!y.del)w=Object.assign({},w,{[sub]:mergeList(x[sub],y[sub])});out.set(y.id,w)});return [...out.values()]}
function mergeState(R,L){const o={v:1,cfg:((L.cfg&&L.cfg.u)||0)>((R.cfg&&R.cfg.u)||0)?L.cfg:R.cfg,months:{},fam:mergeList(R.fam||[],L.fam||[])};
  [...new Set([...Object.keys(R.months),...Object.keys(L.months)])].sort().forEach(k=>{const a=R.months[k],b=L.months[k];
    if(!a||!b){o.months[k]=a||b;return}if(a.del||b.del){o.months[k]=(b.u||0)>(a.u||0)?b:a;return}
    o.months[k]={bills:mergeList(a.bills,b.bills),weeks:mergeList(a.weeks,b.weeks,'items'),u:Math.max(a.u||0,b.u||0)}});return o}
function scheduleSync(){if(!auth||!FB.apiKey)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(),1500)}
async function syncNow(manual){
  if(!auth||!FB.apiKey||!S||syncing)return;syncing=true;syncSt.st='busy';renderSync();
  try{for(let i=0;i<4;i++){
      const tk=await idToken();let r=await fetch(docUrl(),{headers:{Authorization:'Bearer '+tk},cache:'no-store'});
      let remote=null,ut=null;if(r.status===200){const j=await r.json();ut=j.updateTime;try{remote=normalize(JSON.parse(j.fields.data.stringValue))}catch(e){remote=null}}else if(r.status!==404)throw new Error('HTTP '+r.status);
      const merged=remote?mergeState(remote,S):S,ms=JSON.stringify(merged);
      if(ms!==JSON.stringify(S)){S=merged;save(true);if(!sheetOpen())render()}
      if(remote&&ms===JSON.stringify(remote))break;
      const q='?updateMask.fieldPaths=data&updateMask.fieldPaths=at&'+(ut?'currentDocument.updateTime='+encodeURIComponent(ut):'currentDocument.exists=false');
      r=await fetch(docUrl()+q,{method:'PATCH',headers:{Authorization:'Bearer '+tk,'Content-Type':'application/json'},body:JSON.stringify({fields:{data:{stringValue:ms},at:{timestampValue:new Date().toISOString()}}})});
      if(r.ok)break; if(r.status===400||r.status===409||r.status===412)continue; throw new Error('HTTP '+r.status)}
    syncSt={st:'ok',at:now()};auth.at=syncSt.at;store.set(KAUTH,auth);if(manual)toast('Sincronizado ✓')}
  catch(e){syncSt.st=(e.message==='Failed to fetch'||!navigator.onLine)?'offline':'err';if(manual)toast(syncSt.st==='offline'?'Sem internet. As mudanças ficam salvas aqui e sobem depois.':'Erro ao sincronizar ('+e.message+')')}
  syncing=false;renderSync();if(ui.tab==='ajustes'&&!sheetOpen()&&manual)render()}
window.famWebUpdate=v=>{if(performance.now()<20000&&!sheetOpen()){FamBridge.reloadApp()}else{toast('Atualização '+v+' pronta. Será aplicada ao reabrir o app.')}};
window.famResume=()=>{if(S&&!getM(curKey())&&Object.keys(S.months).length){ensureMonth(curKey())}render();syncNow();checkUpdateAuto(false);if(meta.driveOn&&hasBridge()&&(!meta.driveLast||now()-meta.driveLast>6*3600e3))driveWrite(false)};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')window.famResume()});
window.addEventListener('online',()=>syncNow());
setInterval(()=>{if(document.visibilityState==='visible')syncNow()},30000);
window.famBack=()=>{if(sheetOpen()){closeSheet();return true}if(ui.tab!=='meses'){ui.tab='meses';render();scrollTo(0,0);return true}if(ui.month!==curKey()){ui.month=curKey();render();return true}return false};

/* ================= Início ================= */
(function init(){
  const saved=store.get(KEY);S=saved?normalize(saved):null;
  if(!S&&window.FAM_SEED&&window.FAM_AUTOSEED){S=normalize(JSON.parse(JSON.stringify(window.FAM_SEED)))}
  if(S){if(!getM(curKey())&&Object.keys(S.months).some(k=>getM(k)))ensureMonth(curKey());else save(true)}
  render(); if(auth)syncNow(); checkUpdateAuto(false);
  try{if(window.FamBridge&&FamBridge.webOk)FamBridge.webOk(APP.build)}catch(e){}
})();
</script>
