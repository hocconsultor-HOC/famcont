name: Gerar APK do CONTAS (FAMCONT)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Copiar o app (HTML) para dentro do Android e ligar a nuvem
        env:
          FB_API_KEY: ${{ secrets.FB_API_KEY }}
          FB_PROJECT_ID: ${{ secrets.FB_PROJECT_ID }}
        run: |
          mkdir -p android/app/src/main/assets
          cp web/index.html android/app/src/main/assets/index.html
          VER=$(python3 -c "import json;print(json.load(open('version.json'))['version'])")
          BUILD=$(python3 -c "import json;print(json.load(open('version.json'))['build'])")
          APK=$(python3 -c "import json;d=json.load(open('version.json'));print(d.get('apk',d['build']))")
          sed -i "s/const FB={apiKey:'',projectId:''}/const FB={apiKey:'${FB_API_KEY}',projectId:'${FB_PROJECT_ID}'}/" android/app/src/main/assets/index.html
          sed -i "s/version:'[0-9.]*',build:[0-9]*/version:'${VER}',build:${BUILD}/" android/app/src/main/assets/index.html
          echo "APP_VERSION=${VER}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${APK}" >> $GITHUB_ENV
      - name: Montar APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: gradle assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk FAMCONT.apk && cp FAMCONT.apk CONTAS.apk
      - name: Publicar no link fixo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-android
          name: CONTAS para Android
          body: "Baixe o APK no celular ou tablet Android e instale. Depois de instalado, o app CONTAS se atualiza sozinho pela internet; só mudanças de ícone ou nome pedem instalar de novo pelo mesmo link."
          files: |
            FAMCONT.apk
            CONTAS.apk
          make_latest: true
